const COLORS = ['#e44','#4af','#4c4','#f80','#f4f','#ff4','#0ff','#fa8','#8af','#f84'];
let colorIdx = 0;
let entries = [];
let initialized = false;

// ── зигзаг ───────────────────────────────────────────────────────────────────
function zigzag(T) {
  const xs = [], ys = [], tp = [];
  let dir = 0, ev = 0, ed = '';
  for (const {h, l, t} of RAW) {
    if (!dir) {
      if (h > ev) { ev = h; ed = t; }
      if (l < ev * (1-T)) { xs.push(ed); ys.push(ev); tp.push('H'); dir=-1; ev=l; ed=t; }
      else if (l < ev) { ev = l; ed = t; }
      if (!dir || dir<0) {
        if (h > ev * (1+T)) { xs.push(ed); ys.push(ev); tp.push('L'); dir=1; ev=h; ed=t; }
      }
    } else if (dir > 0) {
      if (h > ev) { ev = h; ed = t; }
      if (l < ev*(1-T)) { xs.push(ed); ys.push(ev); tp.push('H'); dir=-1; ev=l; ed=t; }
    } else {
      if (l < ev) { ev = l; ed = t; }
      if (h > ev*(1+T)) { xs.push(ed); ys.push(ev); tp.push('L'); dir=1; ev=h; ed=t; }
    }
  }
  if (dir && ed) { xs.push(ed); ys.push(ev); tp.push(dir>0?'H':'L'); }
  return {xs, ys, tp};
}

// ── контролы ─────────────────────────────────────────────────────────────────
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  for (const e of entries) {
    const row = document.createElement('div');
    row.className = 'trow';
    const pct = (e.T*100).toFixed(2).replace(/\.?0+$/,'') + '%';
    row.innerHTML =
      `<span class="dot" style="background:${e.color}"></span>` +
      `<span style="color:#888;font-size:11px">T=</span>` +
      `<input type="range" class="sl" min="0.1" max="20" step="0.05" value="${(e.T*100).toFixed(2)}" data-id="${e.id}">` +
      `<span class="tv" id="tv_${e.id}">${pct}</span>` +
      `<input type="number" class="ni" min="0.1" max="30" step="0.05" value="${(e.T*100).toFixed(2)}" data-id="${e.id}">` +
      `<span style="color:#555">%</span>` +
      `<input type="checkbox" class="vis" ${e.vis?'checked':''} data-id="${e.id}">` +
      `<button class="rmv" data-id="${e.id}">×</button>`;
    c.appendChild(row);
  }
  c.querySelectorAll('.sl').forEach(el => el.addEventListener('input', () => {
    syncEntry(el.dataset.id, parseFloat(el.value)/100, el);
  }));
  c.querySelectorAll('.ni').forEach(el => el.addEventListener('change', () => {
    const v = Math.max(0.1, Math.min(30, parseFloat(el.value)||1));
    el.value = v.toFixed(2);
    syncEntry(el.dataset.id, v/100, el);
  }));
  c.querySelectorAll('.vis').forEach(el => el.addEventListener('change', () => {
    entries.find(e => e.id == el.dataset.id).vis = el.checked;
    redraw();
  }));
  c.querySelectorAll('.rmv').forEach(el => el.addEventListener('click', () => {
    entries = entries.filter(e => e.id != el.dataset.id);
    renderControls(); redraw();
  }));
}

function syncEntry(id, T, src) {
  const e = entries.find(x => x.id == id);
  e.T = T;
  const pct = (T*100).toFixed(2).replace(/\.?0+$/,'') + '%';
  document.getElementById('tv_' + id).textContent = pct;
  const row = src.closest('.trow');
  const sl = row.querySelector('.sl');
  const ni = row.querySelector('.ni');
  if (src !== sl) sl.value = (T*100).toFixed(2);
  if (src !== ni) ni.value = (T*100).toFixed(2);
  redraw();
}

function addEntry(T) {
  const color = COLORS[colorIdx % COLORS.length];
  colorIdx++;
  entries.push({id: Date.now()+Math.random(), T, color, vis: true});
  renderControls();
  redraw();
}

// ── трассы ───────────────────────────────────────────────────────────────────
function buildTraces() {
  const showPivots  = document.getElementById('chkPivots').checked;
  const showCandles = document.getElementById('chkCandles').checked;

  const trs = [];

  if (showCandles) {
    trs.push({
      type: 'candlestick',
      x: RAW.map(d=>d.t), open: RAW.map(d=>d.o),
      high: RAW.map(d=>d.h), low: RAW.map(d=>d.l), close: RAW.map(d=>d.c),
      name: 'SBER',
      increasing: {line:{color:'#4c4',width:1}, fillcolor:'#193319'},
      decreasing: {line:{color:'#c44',width:1}, fillcolor:'#331919'},
      whiskerwidth: 0.5,
      hoverinfo: 'x+y',
    });
  }

  let stParts = [];

  for (const e of entries) {
    if (!e.vis) continue;
    const {xs, ys, tp} = zigzag(e.T);
    const label = `ZZ ${(e.T*100).toFixed(2).replace(/\.?0+$/,'')}%`;

    trs.push({
      type:'scatter', mode:'lines',
      x:xs, y:ys,
      name: label,
      line:{color:e.color, width:1.5},
      hoverinfo:'skip',
      legendgroup: String(e.id),
    });

    if (showPivots) {
      const hxs=[], hys=[], lxs=[], lys=[];
      for (let i=0;i<xs.length;i++) {
        if (tp[i]==='H'){hxs.push(xs[i]);hys.push(ys[i]);}
        else            {lxs.push(xs[i]);lys.push(ys[i]);}
      }
      trs.push({
        type:'scatter', mode:'markers',
        x:hxs, y:hys, showlegend:false,
        marker:{symbol:'triangle-down', size:6, color:e.color, opacity:0.9},
        hovertemplate:`<b>H</b> ${label}<br>%{x}  %{y:.2f} ₽<extra></extra>`,
        legendgroup: String(e.id),
      });
      trs.push({
        type:'scatter', mode:'markers',
        x:lxs, y:lys, showlegend:false,
        marker:{symbol:'triangle-up', size:6, color:e.color, opacity:0.9},
        hovertemplate:`<b>L</b> ${label}<br>%{x}  %{y:.2f} ₽<extra></extra>`,
        legendgroup: String(e.id),
      });
    }

    stParts.push(`<span style="color:${e.color}">${label}: ${xs.length} пив.</span>`);
  }

  document.getElementById('st').innerHTML = stParts.join('<span class="sep">|</span>');
  return trs;
}

    linecolor:'#333',
    tickfont:{color:'#888'},
    rangebreaks:[{bounds:['sat','mon']}],
  },
  yaxis:{
    gridcolor:'#2a2a2a', showgrid:true,
    tickfont:{color:'#888'},
    fixedrange:false,
  },
  margin:{l:60,r:10,t:10,b:40},
  legend:{bgcolor:'rgba(26,26,26,0.85)', bordercolor:'#444', borderwidth:1,
          font:{color:'#ccc',size:11}, x:0.01, y:0.99},
  hovermode:'x',
  uirevision:'keep',
};

function setLogScale(log) {
  LAYOUT.yaxis.type = log ? 'log' : 'linear';
  LAYOUT.yaxis.tickformat = log ? '' : '.0f';
  if (initialized) Plotly.relayout('plot', {'yaxis.type': log?'log':'linear'});
}

function redraw() {
  const trs = buildTraces();
  if (!initialized) {
    // default range: last 5 years
    const last = RAW[RAW.length-1].t;
    const y5 = new Date(last);
    y5.setFullYear(y5.getFullYear()-5);
    LAYOUT.xaxis.range = [y5.toISOString().slice(0,10), last];
    LAYOUT.yaxis.type = document.getElementById('chkLog').checked ? 'log' : 'linear';
    Plotly.newPlot('plot', trs, LAYOUT, {responsive:true, displayModeBar:true,
      modeBarButtonsToRemove:['select2d','lasso2d','autoScale2d'],
    });
    initialized = true;
  } else {
    Plotly.react('plot', trs, LAYOUT);
  }
}

// ── пресеты ──────────────────────────────────────────────────────────────────
const PRESETS = [0.5, 1, 1.5, 2, 3, 4, 6, 8, 12, 15];
const pdiv = document.getElementById('presets');
for (const v of PRESETS) {
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = v + '%';
  b.addEventListener('click', () => addEntry(v/100));
  pdiv.appendChild(b);
}

document.getElementById('btnAdd').addEventListener('click', () => addEntry(0.04));
document.getElementById('chkLog').addEventListener('change', e => setLogScale(e.target.checked));
document.getElementById('chkPivots').addEventListener('change', redraw);
document.getElementById('chkCandles').addEventListener('change', redraw);

// ── старт ─────────────────────────────────────────────────────────────────────
[1, 2, 4, 8].forEach(v => addEntry(v/100));
</script>
</body>
</html>
